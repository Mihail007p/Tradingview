# ============================================================
#  Chart Analyst Bot — конфиг Cloudflare Worker
# ============================================================

name = "chart-analyst-bot"
main = "src/index.js"
compatibility_date = "2025-12-01"

# --- Workers AI (multimodal / vision) ------------------------
[ai]
binding = "AI"

# --- Переменные окружения ------------------------------------
# ACCESS_KEY — необязательный секрет. Если задан, UI требует его,
# чтобы никто другой не тратил твою квоту Workers AI.
# Модель можно переопределить без правки кода.
[vars]
# VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# ACCESS_KEY   = "придумай_длинный_секрет"

# --- Журнал сделок на Cloudflare KV --------------------------
# 1. Создай неймспейс:
#      npx wrangler kv namespace create JOURNAL
# 2. Wrangler выведет id — вставь его ниже и раскомментируй:
#
# [[kv_namespaces]]
# binding = "JOURNAL"
# id = "ЗДЕСЬ_ID_ИЗ_ШАГА_1"

# --- Лимиты ---------------------------------------------------
[limits]
cpu_ms = 50_000
