# ============================================================
#  Chart Analyst Bot — конфиг Cloudflare Worker
# ============================================================

name = "chart-analyst-bot"
main = "src/index.js"
compatibility_date = "2025-12-01"

# --- Workers AI (multimodal / vision) ------------------------
[ai]
binding = "AI"

# --- Переменные окружения ------------------------------------
# VISION_MODEL — можно переопределить без правки кода.
# ACCESS_KEY — НЕ прописывай здесь (это секрет). Добавь его в
#   GitHub Secrets → ACCESS_KEY  (CI сам зальёт как Cloudflare Secret),
#   или вручную: `echo "<ключ>" | npx wrangler secret put ACCESS_KEY`.
# Если задан — UI требует его в заголовке X-Api-Key / ?key=..., чтобы
# никто другой не тратил твою квоту Workers AI.
[vars]
# VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

# --- Журнал сделок на Cloudflare KV --------------------------
# 1. Создай неймспейс:
#      npx wrangler kv namespace create JOURNAL
# 2. Wrangler выведет id — вставь его ниже и раскомментируй:
#
# [[kv_namespaces]]
# binding = "JOURNAL"
# id = "ЗДЕСЬ_ID_ИЗ_ШАГА_1"

# --- Лимиты ---------------------------------------------------
# ВНИМАНИЕ: `cpu_ms` поддерживается только на платном плане Workers.
# На Free plan Cloudflare отвечает ошибкой 100328
#   "CPU limits are not supported for the Free plan..."
# и `wrangler deploy` падает. Закомментировано, чтобы автодеплой проходил
# на Free-аккаунте. При переходе на Workers Paid — раскомментируй обратно.
# [limits]
# cpu_ms = 50_000
