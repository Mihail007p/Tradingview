# ============================================================
#  Chart Analyst Bot — автодеплой в Cloudflare Workers
#
#  Что нужно один раз настроить в репозитории:
#    Settings → Secrets and variables → Actions → New repository secret
#      CLOUDFLARE_API_TOKEN   — токен с правами "Edit Cloudflare Workers"
#      CLOUDFLARE_ACCOUNT_ID  — Account ID из Cloudflare dashboard
#      ACCESS_KEY   (необязательно) — секрет доступа, чтобы никто не тратил
#                       твою квоту Workers AI. CI сам зальёт его как
#                       Cloudflare Secret на каждом деплое.
#
#  После этого каждый push в main автоматически деплоит воркер.
# ============================================================

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]      # PR → только проверка сборки, без деплоя
  workflow_dispatch:      # ручной запуск кнопкой "Run workflow"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm ci — быстрее и воспроизводимо, но требует package-lock.json.
        # Если лока нет (например, файлы перенесены без него) — откатываемся на npm install.
        run: npm ci || npm install --no-audit --no-fund

      # KV-неймспейс нужен для журнала сделок. Скрипт находит существующий
      # или создаёт новый и дописывает binding в wrangler.toml перед деплоем.
      # Если KV недоступен — шаг не валит билд, сайт деплоится без журнала.
      - name: Resolve KV namespace for trade journal
        if: github.event_name != 'pull_request'
        id: kv
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ensure-kv.sh

      - name: Build check (dry-run)
        run: npx wrangler deploy --dry-run --outdir dist

      # ACCESS_KEY — секрет доступа, чтобы никто не тратил твою квоту Workers AI.
      # Если секрет добавлен в GitHub Secrets — заливаем его как Cloudflare Secret
      # (он НЕ попадёт в wrangler.toml и не будет виден в plain text в dashboard).
      # Если секрета нет — шаг просто пропускается.
      - name: Upload ACCESS_KEY secret to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: |
          if [ -z "${ACCESS_KEY:-}" ]; then
            echo "ACCESS_KEY не задан в GitHub Secrets — пропускаю (доступ к воркеру будет открытым)."
            exit 0
          fi
          echo "Uploading ACCESS_KEY as a Cloudflare secret..."
          echo "$ACCESS_KEY" | npx wrangler secret put ACCESS_KEY

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🚀 Деплой завершён" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Коммит: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Журнал сделок (KV): \`${{ steps.kv.outputs.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL смотри в логах шага Deploy или в Cloudflare dashboard" >> "$GITHUB_STEP_SUMMARY"
